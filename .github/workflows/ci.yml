name: Build and portability
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make build ENGINE=docker
      - name: Test distro compatibility
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -eu
          version=$(cat VERSION)
          binary="$PWD/dist/aws_signing_helper-$version-linux-$ARCH-static"
          for image in alpine:3.24 debian:12-slim ubuntu:24.04 amazonlinux:2023 gcr.io/distroless/static-debian12; do
            test "$(docker run --rm --network none --user 100:1000 -v "$binary:/helper:ro" --entrypoint /helper "$image" version)" = "$version"
          done
          printf 'FROM scratch\nCOPY helper /helper\nENTRYPOINT ["/helper"]\n' > dist/Dockerfile
          cp "$binary" dist/helper
          docker build -t helper-scratch dist
          test "$(docker run --rm --network none helper-scratch version)" = "$version"
          rm dist/helper dist/Dockerfile
          (cd dist && tar -czf "licenses-$ARCH.tar.gz" licenses && rm -r licenses)
          echo "BINARY=$binary" >> "$GITHUB_ENV"
      - name: Generate binary SBOM
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          file: ${{ env.BINARY }}
          format: spdx-json
          output-file: dist/sbom-${{ matrix.arch }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - run: (cd dist && sha256sum aws_signing_helper-* build-info-* licenses-*.tar.gz sbom-*.spdx.json > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: helper-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
  package:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: helper-*
          path: incoming
      - name: Verify and assemble release assets
        run: |
          set -eu
          version=$(cat VERSION)
          mkdir release
          for arch in amd64 arm64; do
            (
              cd "incoming/helper-$arch"
              sha256sum --strict -c SHA256SUMS
              cp "aws_signing_helper-$version-linux-$arch-static" "build-info-$arch.txt" "licenses-$arch.tar.gz" "sbom-$arch.spdx.json" ../../release/
            )
          done
          (cd release && sha256sum * > SHA256SUMS && sha256sum --strict -c SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release/
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag and reviewed commit
        run: |
          set -eu
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release
      - run: (cd release && sha256sum --strict -c SHA256SUMS)
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          printf 'Unofficial static Linux builds from AWS upstream commit %s. Review license bundles and SBOMs before publishing.\n' "$(cat UPSTREAM_COMMIT)" > release-notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "$GITHUB_REF_NAME" --notes-file release-notes.md release/*
